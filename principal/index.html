<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Gabriela Ferrer" />
    <meta
      name="description"
      content="Guarda tus secretos con el Encriptador de texto. Es un proyecto que es parte de la formación de Alura Latam + Oracle."
    />
    <meta name="keywords" content="Encriptador, texto, secreto, proyecto" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Encriptador de texto</title>

    <link rel="icon" href="/img/favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <nav id="bar-nav">
        <div id="logo-text">
          <img
            src="/img/favicon.svg"
            id="logo"
            alt="Este es el logo de la página"
            class="item-nav"
          />

          <span class="title">Guarda tus secretos</span>
        </div>
        <span class="item-nav">Alura Latam & Oracle</span>
      </nav>
    </header>

    <main id="container">
      <section id="request-container">
        <div id="instructions">
          <img src="/img/bi_exclamation-circle-fill.svg" alt="Importante" />
          <span>Solo letras minúsculas y sin acentos</span>
        </div>
        <input type="text" title="Cuentame tu secreto..." />
        <div id="buttons-container">
          <button class="button">Encriptar</button>
          <button class="button">Desencriptar</button>
        </div>
      </section>

      <article id="resp-container">
        <header id="cat-eyes-container">
          <img src="/img/Gatito.svg" alt="Soy un Gatito" id="cat-eyes" />
        </header>
        <main id="text-container">
          <h1>No logre encontrar tu Prrr... mensaje</h1>
          <p>Ingresa el texto que desees encriptar o desencriptar.</p>
        </main>
      </article>
    </main>

    <footer>
      <div id="links-container">
        <a
          href="https://github.com/MorganSnape/Encriptador-Texto"
          class="link"
          target="_blank"
          rel="noopener"
          ><img src="/img/mdi_github.svg" alt="GhitHub" class="icon"
        /></a>
        <a
          href="https://www.linkedin.com/in/gabriela-de-los-angeles-ferrer-martinez-8a45771a4/"
          target="_blank"
          class="link"
          rel="noopener"
          ><img src="/img/mdi_linkedin.svg" alt="linkedIn" class="icon"
        /></a>
      </div>
      <p id="desarrollado-por">©2024 - Desarrollado por Gabriela Ferrer</p>
    </footer>
  </body>
</html>
